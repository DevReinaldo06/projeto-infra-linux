# DHCP do fw-gw: atende apenas a LAN (10.0.2.0/24)
authoritative;                    # este servidor é a autoridade da rede
default-lease-time 3600;          # cada IP emprestado por 1 hora
max-lease-time 3600;

option domain-name "empresa.local";
option domain-name-servers 10.0.2.1;   # o DNS é o próprio fw-gw

subnet 10.0.2.0 netmask 255.255.255.0 {
  range 10.0.2.100 10.0.2.200;          # pool automático
  option routers 10.0.2.1;              # gateway da LAN
  option broadcast-address 10.0.2.255;
}

# Reservas por MAC (ficam fora do pool: .10 e .50 são menores que .100)
host file-lan {
  hardware ethernet 08:00:27:5f:08:cc;   # MAC do file-lan (Marco), placa enp0s8
  fixed-address 10.0.2.10;
}
host admin-lan {
  hardware ethernet 08:00:27:76:13:95;   # MAC do admin-lan (Eduardo), placa enp0s8
  fixed-address 10.0.2.50;
}
