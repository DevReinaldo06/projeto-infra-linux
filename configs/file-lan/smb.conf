# =====================================================================
# /etc/samba/smb.conf  -  file-lan (arquivos.empresa.local, 10.0.2.10)
# Samba 4 em Ubuntu Server 24.04
# Entrega: configs/file-lan/smb.conf
# Valide sempre com:  testparm -s
# =====================================================================

[global]
    # --- Identificação -------------------------------------------------
    # Grupo de trabalho (nome do "domínio" simples do Windows, sem AD).
    workgroup = WORKGROUP
    # Texto que aparece ao listar o servidor na rede.
    server string = Servidor de Arquivos - empresa.local
    # Servidor independente: não participa de domínio Active Directory.
    server role = standalone server

    # --- Autenticação e segurança -------------------------------------
    # Todo acesso exige usuário e senha cadastrados no Samba (smbpasswd).
    security = user
    # Usuário desconhecido ou senha errada = recusado (nunca vira "guest").
    map to guest = Never
    # Proíbe SMB1 (protocolo antigo e vulnerável); aceita só SMB2 ou superior.
    server min protocol = SMB2
    # Nível 2: bloqueia listagem anônima de usuários e compartilhamentos.
    restrict anonymous = 2

    # --- Controle por endereço IP -------------------------------------
    # Só aceita conexões da LAN, do db-zone (backup) e do próprio servidor.
    # A regra "hosts deny = ALL" bloqueia o resto. Quando o IP está nas duas
    # listas, "hosts allow" vence.
    hosts allow = 10.0.2.0/24 10.0.3.10 127.0.0.1
    hosts deny = ALL

    # --- Logs ----------------------------------------------------------
    # Um arquivo de log por máquina cliente (%m = nome do cliente).
    log file = /var/log/samba/log.%m
    # Tamanho máximo de cada log em KB (1000 KB = ~1 MB), depois rotaciona.
    max log size = 1000

    # --- Impressão desativada (servidor só de arquivos) ---------------
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes


# =====================================================================
# Compartilhamentos
# =====================================================================

# --- publico: todos os funcionários leem e escrevem ------------------
[publico]
    comment = Area comum da empresa
    path = /compartilhado/publico
    # Quem pode entrar: só o grupo funcionarios.
    valid users = @funcionarios
    # Leitura e escrita para quem entrou.
    read only = no
    # Permissões de arquivos novos: rw-rw-r--
    create mask = 0664
    # Permissões de pastas novas: rwxrwsr-x (o 2 mantém o setgid).
    directory mask = 2775
    # Esconde arquivos que o usuário não pode ler.
    hide unreadable = yes


# --- projetos: devs escrevem, diretoria só lê, mkt não entra ---------
[projetos]
    comment = Projetos de desenvolvimento
    path = /compartilhado/projetos
    # Quem pode entrar: devs e diretoria (mkt fica de fora).
    valid users = @devs @diretoria
    # Por padrão o share é somente leitura...
    read only = yes
    # ...e só quem está em write list ganha escrita. Diretoria só lê.
    write list = @devs
    create mask = 0660
    directory mask = 2770
    # Este share só é acessível pela LAN (o db-zone não entra aqui).
    hosts allow = 10.0.2.0/24


# --- backups: backup_mgr grava, diretoria só lê ----------------------
[backups]
    comment = Backups do banco de dados
    path = /compartilhado/backups
    valid users = @backup_mgr @diretoria
    read only = yes
    write list = @backup_mgr
    create mask = 0660
    directory mask = 2770
    # LAN (diretoria consulta) e db-zone (svc_backup envia o backup).
    hosts allow = 10.0.2.0/24 10.0.3.10
