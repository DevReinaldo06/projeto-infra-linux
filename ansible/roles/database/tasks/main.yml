---
- name: Instalar PostgreSQL 16 e ferramentas de backup
  ansible.builtin.apt:
    name:
      - postgresql-16
      - python3-psycopg2
      - acl
      - cron
      - logrotate
      - smbclient
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configurar o PostgreSQL e o appdb
  ansible.builtin.import_tasks: postgresql.yml

- name: Preparar diretórios de backup e log
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  loop:
    - /var/backups/postgresql
    - /var/log/backup-postgres

- name: Instalar script, agendamento e rotação do backup
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    validate: "{{ item.validate | default(omit) }}"
  loop:
    - src: scripts/backup_postgres.sh
      dest: /usr/local/bin/backup_postgres.sh
      group: postgres
      mode: '0750'
      validate: /bin/bash -n %s
    - src: configs/db-zone/backup-postgres.cron
      dest: /etc/cron.d/backup-postgres
      group: root
      mode: '0644'
    - src: configs/db-zone/backup-postgres.logrotate
      dest: /etc/logrotate.d/backup-postgres
      group: root
      mode: '0644'
      validate: /usr/sbin/logrotate --debug %s

- name: Habilitar o serviço cron
  ansible.builtin.service:
    name: cron
    enabled: true
    state: started
