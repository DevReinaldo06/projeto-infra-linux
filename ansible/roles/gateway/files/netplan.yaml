# fw-gw: roteador entre WAN, DMZ, LAN e DB Zone
network:
  version: 2
  renderer: networkd
  ethernets:
    enp0s3:            # WAN (adaptador 1, Bridge): IP automático do seu roteador
      dhcp4: true
    enp0s8:            # DMZ (adaptador 2, rede-dmz)
      dhcp4: false
      addresses: [10.0.1.1/24]
    enp0s9:            # LAN (adaptador 3, rede-lan)
      dhcp4: false
      addresses: [10.0.2.1/24]
    enp0s10:           # DB Zone (adaptador 4, rede-db)
      dhcp4: false
      addresses: [10.0.3.1/24]
