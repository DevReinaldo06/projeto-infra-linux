# Role gateway: pacotes, roteamento, DHCP e DNS do fw-gw
# O firewall (iptables) fica na role "firewall", do Eduardo.

- name: Instalar pacotes do gateway
  ansible.builtin.apt:
    name: [isc-dhcp-server, bind9, bind9utils, iptables-persistent]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ligar o encaminhamento de pacotes
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/99-roteamento.conf
    reload: true

- name: Copiar o netplan do gateway
  ansible.builtin.copy:
    src: netplan.yaml
    dest: /etc/netplan/50-fw-gw.yaml
    owner: root
    group: root
    mode: "0600"

- name: Definir a interface do DHCP
  ansible.builtin.copy:
    src: isc-dhcp-server
    dest: /etc/default/isc-dhcp-server
    owner: root
    group: root
    mode: "0644"
  notify: Reiniciar dhcp

- name: Copiar o dhcpd.conf validando a sintaxe antes
  ansible.builtin.copy:
    src: dhcpd.conf
    dest: /etc/dhcp/dhcpd.conf
    owner: root
    group: root
    mode: "0644"
    validate: dhcpd -t -cf %s
  notify: Reiniciar dhcp

- name: Copiar as opcoes do Bind9
  ansible.builtin.copy:
    src: named.conf.options
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0644"
    validate: named-checkconf %s
  notify: Reiniciar bind

- name: Copiar a lista de zonas do Bind9
  ansible.builtin.copy:
    src: named.conf.local
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: "0644"
  notify: Reiniciar bind

- name: Criar a pasta das zonas
  ansible.builtin.file:
    path: /etc/bind/zones
    state: directory
    owner: root
    group: bind
    mode: "0755"

- name: Copiar os arquivos de zona
  ansible.builtin.copy:
    src: "zonas/{{ item }}"
    dest: "/etc/bind/zones/{{ item }}"
    owner: root
    group: bind
    mode: "0644"
  loop:
    - db.empresa.local
    - db.10.0.1
    - db.10.0.2
    - db.10.0.3
  notify: Reiniciar bind

- name: Validar a configuracao completa do Bind9 (inclui as zonas)
  ansible.builtin.command: named-checkconf -z
  changed_when: false

- name: Garantir DHCP e DNS ligados e iniciando no boot
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - isc-dhcp-server
    - bind9
